name: Build Rescue35 iOS
on:
  push:
    branches:
      - master
      - main

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: 🔍 Hanapin kung NASAAAN ang IPA
        run: |
          echo "=== List ng build folder ==="
          ls -la build/
          echo "=== List ng build/ios ==="
          ls -la build/ios/
          echo "=== List ng build/ios/ipa ==="
          ls -la build/ios/ipa/ || echo "WALA SA IPA FOLDER!"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Rescue35-iOS-Build
          path: build/ios/