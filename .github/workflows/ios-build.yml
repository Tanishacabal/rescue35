name: Build Rescue35 iOS
on:
  push:
    branches:
      - master
      - main

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 📥 I-download ang code
        uses: actions/checkout@v4

      - name: 🔧 I-setup ang Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: 📦 I-install ang dependencies
        run: flutter pub get

      - name: 🔨 I-build ang iOS app
        run: flutter build ipa --release --no-codesign

      - name: ✅ I-upload ang IPA file
        uses: actions/upload-artifact@v4
        with:
          name: Rescue35-iOS-Build
          path: build/ios/ipa/*.ipa